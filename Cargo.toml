[package]
name = "env_notify_telegram"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0" # Debian 13
license = "AGPL-3.0"
authors = ["Alexander A. Klimov <a@kli.mov>"]

[dependencies]
humantime = "2.3.0"
percent-encoding-rfc3986 = "0.1.3"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.redis]
version = "1.2.2"
default-features = false
features = ["tls-native-tls"]

[dependencies.ureq]
version = "3.2.0"
default-features = false
features = ["native-tls", "json"]
