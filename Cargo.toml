[package]
name = "env_notify_telegram"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0" # Debian 13
license = "AGPL-3.0"
authors = ["Alexander A. Klimov <a@kli.mov>"]

[dependencies]
humantime = "2.3.0"
serde_json = "1.0.154"
teloxide-core = "0.13.0"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_with]
version = "3.17.0"
features = ["base64"]

[dependencies.tokio]
version = "1.54.1"
features = ["macros"]
